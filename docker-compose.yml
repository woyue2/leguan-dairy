services:
  diary-app:
    build: .
    container_name: diary-app
    ports:
      - "4000:4000"
    volumes:
      # 数据持久化 - 保存到服务器的这个目录
      - diary-data:/data/diary
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data/diary
      - PORT=4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: diary-caddy
    depends_on:
      - diary-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  diary-data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
