<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Doing - 布局方案 4 (全功能看板)</title>
    <!-- 引入 SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root { --accent-color: #4a90d9; --text-color: #2c3e50; --bg-color: #f5f7fa; }
        
        body { background-color: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; margin: 0; }
        .doing-container { display: flex; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; max-width: 100%; margin: 0 auto; }
        
        .cornell-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .cornell-title-group h1 { margin: 0; font-size: 1.5rem; color: var(--text-color); }
        .back-btn { text-decoration: none; color: #666; font-weight: bold; padding: 8px 16px; border-radius: 20px; background: #eef1f5; }
        .back-btn:hover { background: #dfe4ea; }

        /* 看板容器 */
        .cornell-right { 
            width: 100%; 
            height: 100%; 
            padding: 0; 
            display: flex; 
            gap: 15px; 
            overflow-x: auto; 
            padding-bottom: 20px;
            align-items: flex-start;
        }
        
        /* 滚动条 */
        .cornell-right::-webkit-scrollbar { height: 12px; }
        .cornell-right::-webkit-scrollbar-track { background: #e0e0e0; border-radius: 6px; }
        .cornell-right::-webkit-scrollbar-thumb { background: #bbb; border-radius: 6px; border: 3px solid #e0e0e0; }
        .cornell-right::-webkit-scrollbar-thumb:hover { background: #999; }

        /* 每一列 */
        .kanban-column {
            flex: 0 0 300px;
            background: #ebecf0;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            max-height: 100%;
            position: relative;
        }
        
        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 4px;
            cursor: pointer; /* 暗示可编辑 */
        }
        
        .column-title { font-weight: 600; color: #172b4d; font-size: 0.95rem; }
        .column-count { background: rgba(0,0,0,0.08); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; color: #5e6c84; font-weight: bold; }
        
        /* 列菜单按钮 */
        .col-menu-btn {
            background: transparent;
            border: none;
            color: #6b778c;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-left: auto;
            margin-right: 8px;
        }
        .col-menu-btn:hover { background: rgba(9, 30, 66, 0.08); color: #172b4d; }

        /* 列表区域 */
        .kanban-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 4px 4px 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 50px; /* 重要：空列表也能拖入 */
        }

        /* 任务卡片 */
        .todo-item {
            background: white;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(9, 30, 66, 0.25);
            cursor: grab;
            position: relative;
            transition: background 0.2s, transform 0.2s;
            /* border-left: 4px solid var(--accent-color); */ /* 也可以用左侧条 */
        }
        
        .todo-item:hover { background: #f4f5f7; }
        .todo-item:active { cursor: grabbing; transform: rotate(2deg); }
        .todo-item.sortable-ghost { opacity: 0.4; background: #ddd; border: 2px dashed #999; }
        .todo-item.sortable-drag { background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transform: scale(1.05); }
        
        /* 卡片内容 */
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .todo-text { font-size: 0.95rem; color: #172b4d; line-height: 1.4; margin: 0; word-break: break-word; }
        
        /* 标签 */
        .item-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
        .tag-pill { font-size: 0.7rem; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
        
        /* 标签颜色 */
        .tag-red { background: #ffbdad; color: #bf2600; }
        .tag-blue { background: #deebff; color: #0747a6; }
        .tag-green { background: #e3fcef; color: #006644; }
        .tag-purple { background: #eae6ff; color: #403294; }

        /* 删除按钮 (Hover显示) */
        .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: rgba(255,255,255,0.8);
            border-radius: 4px;
            color: #6b778c;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            font-size: 1.1rem;
            line-height: 1;
        }
        .delete-btn:hover { background: #ffebe6; color: #de350b; }
        .todo-item:hover .delete-btn { opacity: 1; }

        /* 底部添加卡片按钮 */
        .add-card-btn {
            margin: 8px 4px;
            padding: 8px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: #5e6c84;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .add-card-btn:hover { background: rgba(9, 30, 66, 0.08); color: #172b4d; }
        .add-card-btn::before { content: "+"; font-size: 1.2rem; }

        /* 新增列按钮 */
        .add-column-wrapper {
            flex: 0 0 300px;
            padding: 10px;
        }
        .add-column-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.5);
            border: 2px dashed #ccc;
            border-radius: 10px;
            color: #666;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-column-btn:hover { background: rgba(255,255,255,0.8); border-color: var(--accent-color); color: var(--accent-color); }

        /* 模态框 (简单的) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-box {
            background: white; padding: 20px; border-radius: 8px; width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-primary { background: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-secondary { background: #eee; color: #333; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

    </style>
</head>
<body>
    <div class="doing-container">
        <header class="cornell-header">
            <div class="cornell-title-group">
                <h1>Interactive Kanban</h1>
                <p style="color:#666; font-size:0.9rem; margin-left:15px;">(Drag & Drop enabled • Try adding columns)</p>
            </div>
            <a href="../index.html" class="back-btn">← Back</a>
        </header>
        
        <main class="cornell-right" id="board">
            <!-- Column 1 -->
            <div class="kanban-column" data-id="col-1">
                <div class="column-header">
                    <span class="column-title">📋 To Do</span>
                    <button class="col-menu-btn">•••</button>
                </div>
                <div class="kanban-list" id="list-1">
                    <div class="todo-item" data-id="task-1">
                        <div class="item-header"><div class="todo-text">Research competitors</div></div>
                        <div class="item-tags"><span class="tag-pill tag-purple">Strategy</span></div>
                        <button class="delete-btn" onclick="deleteTask(this)">×</button>
                    </div>
                    <div class="todo-item" data-id="task-2">
                        <div class="item-header"><div class="todo-text">Draft initial sketches</div></div>
                        <div class="item-tags"><span class="tag-pill tag-blue">Design</span></div>
                        <button class="delete-btn" onclick="deleteTask(this)">×</button>
                    </div>
                </div>
                <button class="add-card-btn" onclick="showAddCardModal('list-1')">Add a card</button>
            </div>
            
            <!-- Column 2 -->
            <div class="kanban-column" data-id="col-2">
                <div class="column-header">
                    <span class="column-title">🔥 In Progress</span>
                    <button class="col-menu-btn">•••</button>
                </div>
                <div class="kanban-list" id="list-2">
                    <div class="todo-item" data-id="task-3">
                        <div class="item-header"><div class="todo-text">Fix navigation bug</div></div>
                        <div class="item-tags"><span class="tag-pill tag-red">Bug</span><span class="tag-pill tag-green">Dev</span></div>
                        <button class="delete-btn" onclick="deleteTask(this)">×</button>
                    </div>
                </div>
                <button class="add-card-btn" onclick="showAddCardModal('list-2')">Add a card</button>
            </div>

            <!-- Column 3 -->
            <div class="kanban-column" data-id="col-3">
                <div class="column-header">
                    <span class="column-title">✅ Done</span>
                    <button class="col-menu-btn">•••</button>
                </div>
                <div class="kanban-list" id="list-3">
                    <div class="todo-item" data-id="task-4">
                        <div class="item-header"><div class="todo-text">Setup project repo</div></div>
                        <button class="delete-btn" onclick="deleteTask(this)">×</button>
                    </div>
                </div>
                <button class="add-card-btn" onclick="showAddCardModal('list-3')">Add a card</button>
            </div>

            <!-- Add Column Button -->
            <div class="add-column-wrapper">
                <button class="add-column-btn" onclick="showAddColumnModal()">
                    <span>+ Add another list</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-add-card" class="modal-overlay">
        <div class="modal-box">
            <h3>Add Card</h3>
            <textarea class="modal-input" id="new-card-text" rows="3" placeholder="Enter a title for this card..."></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn-primary" onclick="confirmAddCard()">Add Card</button>
            </div>
        </div>
    </div>

    <div id="modal-add-column" class="modal-overlay">
        <div class="modal-box">
            <h3>Add List</h3>
            <input type="text" class="modal-input" id="new-column-title" placeholder="Enter list title...">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn-primary" onclick="confirmAddColumn()">Add List</button>
            </div>
        </div>
    </div>

    <script>
        // Store current context for modals
        let currentListId = null;

        // Initialize SortableJS for all lists
        function initSortable() {
            const lists = document.querySelectorAll('.kanban-list');
            lists.forEach(list => {
                new Sortable(list, {
                    group: 'shared', // Allow dragging between lists
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onEnd: function (evt) {
                        console.log('Item moved from ' + evt.from.id + ' to ' + evt.to.id);
                        // Here you would update the data model
                    }
                });
            });
        }

        // Initial setup
        initSortable();

        // Delete Task
        function deleteTask(btn) {
            if(confirm('Are you sure you want to delete this card?')) {
                const card = btn.closest('.todo-item');
                card.remove();
            }
        }

        // Modal Logic
        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none');
            document.getElementById('new-card-text').value = '';
            document.getElementById('new-column-title').value = '';
        }

        function showAddCardModal(listId) {
            currentListId = listId;
            document.getElementById('modal-add-card').style.display = 'flex';
            document.getElementById('new-card-text').focus();
        }

        function confirmAddCard() {
            const text = document.getElementById('new-card-text').value;
            if (text.trim() && currentListId) {
                const list = document.getElementById(currentListId);
                const card = document.createElement('div');
                card.className = 'todo-item';
                card.innerHTML = `
                    <div class="item-header"><div class="todo-text">${text}</div></div>
                    <button class="delete-btn" onclick="deleteTask(this)">×</button>
                `;
                list.appendChild(card);
                closeModals();
            }
        }

        function showAddColumnModal() {
            document.getElementById('modal-add-column').style.display = 'flex';
            document.getElementById('new-column-title').focus();
        }

        function confirmAddColumn() {
            const title = document.getElementById('new-column-title').value;
            if (title.trim()) {
                const board = document.getElementById('board');
                const addBtnWrapper = document.querySelector('.add-column-wrapper');
                
                const newCol = document.createElement('div');
                newCol.className = 'kanban-column';
                const listId = 'list-' + Date.now();
                
                newCol.innerHTML = `
                    <div class="column-header">
                        <span class="column-title">${title}</span>
                        <button class="col-menu-btn">•••</button>
                    </div>
                    <div class="kanban-list" id="${listId}"></div>
                    <button class="add-card-btn" onclick="showAddCardModal('${listId}')">Add a card</button>
                `;
                
                // Insert before the "Add Column" button
                board.insertBefore(newCol, addBtnWrapper);
                
                // Initialize sortable for the new list
                new Sortable(newCol.querySelector('.kanban-list'), {
                    group: 'shared',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag'
                });
                
                closeModals();
            }
        }

        // Close modal on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                closeModals();
            }
        }
    </script>
</body>
</html>
