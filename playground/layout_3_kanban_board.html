<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Doing - 布局方案 3 (看板模式)</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root { --accent-color: #4a90d9; --text-color: #2c3e50; --bg-color: #f5f7fa; }
        
        body { background-color: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        .doing-container { display: flex; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; max-width: 1400px; margin: 0 auto; }
        
        .cornell-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .cornell-title-group h1 { margin: 0; font-size: 1.8rem; color: var(--text-color); }
        .back-btn { text-decoration: none; color: #666; font-weight: bold; }
        
        /* 隐藏侧边栏 */
        .cornell-left { display: none; }
        
        /* 看板布局 */
        .cornell-right { width: 100%; height: 100%; padding: 0; display: flex; gap: 20px; overflow-x: auto; }
        
        .kanban-column {
            flex: 1;
            min-width: 300px;
            background: #eef1f5;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        
        .column-title { font-weight: bold; color: #555; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .column-count { background: #dce2e8; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; color: #666; }
        
        .kanban-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        /* 任务卡片 */
        .todo-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border-left: 4px solid var(--accent-color);
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 0; /* reset */
        }
        
        .todo-item:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .todo-item:active { cursor: grabbing; }
        
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .todo-text { font-size: 1rem; color: #333; line-height: 1.4; margin: 0; font-weight: 500; }
        
        .item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; font-size: 0.8rem; color: #999; }
        
        /* 状态颜色 */
        .status-todo .todo-item { border-left-color: #bdc3c7; }
        .status-doing .todo-item { border-left-color: #4a90d9; }
        .status-done .todo-item { border-left-color: #2ecc71; opacity: 0.7; }
        .status-done .todo-text { text-decoration: line-through; }
        
        /* 优先级标记 */
        .priority-badge { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .p-urgent { background: #ff6b6b; }
        .p-deep { background: #5f27cd; }
        
        /* 添加按钮 */
        .add-card-btn {
            margin-top: 10px;
            padding: 10px;
            background: transparent;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            color: #718096;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .add-card-btn:hover { border-color: var(--accent-color); color: var(--accent-color); background: rgba(74, 144, 217, 0.05); }

    </style>
</head>
<body>
    <div class="doing-container">
        <header class="cornell-header">
            <div class="cornell-title-group">
                <h1>Task Board</h1>
            </div>
            <a href="../index.html" class="back-btn">← Back</a>
        </header>
        
        <main class="cornell-right">
            <!-- Column 1: To Do -->
            <div class="kanban-column status-todo">
                <div class="column-header">
                    <span class="column-title">To Do</span>
                    <span class="column-count">3</span>
                </div>
                <div class="kanban-list">
                    <div class="todo-item">
                        <div class="item-header">
                            <div class="todo-text"><span class="priority-badge p-deep"></span>Write Documentation</div>
                        </div>
                        <div class="item-footer">
                            <span>#DeepWork</span>
                            <span>2h</span>
                        </div>
                    </div>
                    <div class="todo-item">
                        <div class="item-header">
                            <div class="todo-text">Plan Q3 Roadmap</div>
                        </div>
                        <div class="item-footer">
                            <span>Strategy</span>
                            <span>Today</span>
                        </div>
                    </div>
                    <div class="todo-item">
                        <div class="item-header">
                            <div class="todo-text">Update Dependencies</div>
                        </div>
                        <div class="item-footer">
                            <span>Maint</span>
                            <span>Low</span>
                        </div>
                    </div>
                </div>
                <button class="add-card-btn">+ Add Task</button>
            </div>
            
            <!-- Column 2: Doing -->
            <div class="kanban-column status-doing">
                <div class="column-header">
                    <span class="column-title" style="color:var(--accent-color)">In Progress</span>
                    <span class="column-count">2</span>
                </div>
                <div class="kanban-list">
                    <div class="todo-item">
                        <div class="item-header">
                            <div class="todo-text"><span class="priority-badge p-urgent"></span>Fix Login Bug</div>
                        </div>
                        <div class="item-footer">
                            <span>Bug</span>
                            <span>Now</span>
                        </div>
                    </div>
                    <div class="todo-item">
                        <div class="item-header">
                            <div class="todo-text">Redesign Task UI</div>
                        </div>
                        <div class="item-footer">
                            <span>UI/UX</span>
                            <span>Active</span>
                        </div>
                    </div>
                </div>
                <button class="add-card-btn">+ Add Task</button>
            </div>
            
            <!-- Column 3: Done -->
            <div class="kanban-column status-done">
                <div class="column-header">
                    <span class="column-title" style="color:#2ecc71">Completed</span>
                    <span class="column-count">2</span>
                </div>
                <div class="kanban-list">
                    <div class="todo-item">
                        <div class="item-header">
                            <div class="todo-text">Morning Standup</div>
                        </div>
                        <div class="item-footer">
                            <span>Meeting</span>
                            <span>9:00 AM</span>
                        </div>
                    </div>
                    <div class="todo-item">
                        <div class="item-header">
                            <div class="todo-text">Check Emails</div>
                        </div>
                        <div class="item-footer">
                            <span>Routine</span>
                            <span>Done</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
